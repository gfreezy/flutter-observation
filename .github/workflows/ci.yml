name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve workspace
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test benchmark example/lib example/test packages/flutter_observation_generator/lib packages/flutter_observation_generator/test

      - name: Analyze runtime
        run: flutter analyze

      - name: Test runtime
        run: flutter test

      - name: Run performance baseline
        run: flutter test benchmark/observation_benchmark.dart

      - name: Analyze generator
        working-directory: packages/flutter_observation_generator
        run: dart analyze

      - name: Test generator
        working-directory: packages/flutter_observation_generator
        run: dart test

      - name: Analyze example
        working-directory: example
        run: flutter analyze

      - name: Test example
        working-directory: example
        run: flutter test

      - name: Verify generated output
        working-directory: example
        run: dart run build_runner build

      - name: Check generated files are current
        run: git diff --exit-code -- example/lib

      - name: Validate runtime package
        run: dart pub publish --dry-run

      - name: Validate generator package
        working-directory: packages/flutter_observation_generator
        run: dart pub publish --dry-run
