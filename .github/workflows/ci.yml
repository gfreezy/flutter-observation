name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve workspace
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test benchmark example/lib example/test packages/flutter_observation_generator/lib packages/flutter_observation_generator/test tool/flutter_observation_devtools_extension/lib tool/flutter_observation_devtools_extension/test

      - name: Analyze runtime
        run: flutter analyze

      - name: Test runtime
        run: flutter test

      - name: Run performance baseline
        run: flutter test benchmark/observation_benchmark.dart

      - name: Analyze generator
        working-directory: packages/flutter_observation_generator
        run: dart analyze

      - name: Test generator
        working-directory: packages/flutter_observation_generator
        run: dart test

      - name: Analyze example
        working-directory: example
        run: flutter analyze

      - name: Test example
        working-directory: example
        run: flutter test

      - name: Analyze DevTools extension
        working-directory: tool/flutter_observation_devtools_extension
        run: flutter analyze

      - name: Test DevTools extension
        working-directory: tool/flutter_observation_devtools_extension
        run: flutter test

      - name: Build DevTools extension
        working-directory: tool/flutter_observation_devtools_extension
        run: dart run devtools_extensions build_and_copy --source=. --dest=../../extension/devtools

      - name: Validate DevTools extension
        working-directory: tool/flutter_observation_devtools_extension
        run: dart run devtools_extensions validate --package=../..

      - name: Check DevTools assets are current
        # Flutter injects a non-deterministic serviceWorkerVersion into this
        # bootstrap file. All deterministic assets remain protected.
        run: git diff --exit-code -- extension/devtools ':(exclude)extension/devtools/build/flutter_bootstrap.js'

      - name: Verify generated output
        working-directory: example
        run: dart run build_runner build

      - name: Check generated files are current
        run: git diff --exit-code -- example/lib

      - name: Validate runtime package
        run: dart pub publish --dry-run

      - name: Validate generator package
        working-directory: packages/flutter_observation_generator
        run: dart pub publish --dry-run
