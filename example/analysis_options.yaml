include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # Observable model declarations intentionally retain explicit types on
    # super parameters so a clean first generator run has type information.
    type_init_formals: false
