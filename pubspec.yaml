name: flutter_observation
description: Property-level observation for Flutter with generated observable models and lifecycle-aware widgets.
version: 0.2.0-dev.2
repository: https://github.com/gfreezy/flutter-observation
issue_tracker: https://github.com/gfreezy/flutter-observation/issues
topics:
  - flutter
  - observation
  - reactive
  - state-management
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

workspace:
  - example
  - packages/flutter_observation_generator
  - tool/flutter_observation_devtools_extension

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
